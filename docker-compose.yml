version: '3.8'

services:
  self-prompting-odqa:
    build: .
    ports:
      - "3000:3000"  # Frontend
      - "8000:8000"  # Backend API
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_PATH=/app/data/self_prompting.db
      - MAX_DEMONSTRATIONS=10
      - DEFAULT_CLUSTERS=10
      - TEMPERATURE=0.7
      - MAX_TOKENS=2048
    volumes:
      - ./data:/app/data
      - ./backend/.env:/app/backend/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - self-prompting-odqa
    restart: unless-stopped
    profiles:
      - production
